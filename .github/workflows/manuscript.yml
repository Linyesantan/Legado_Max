name: Manuscript Build
on:
  push:
    branches: [manuscript-roundtrip]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manuscript-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test VM roundtrip
        run: python3 -m unittest discover -s tools/novel_roundtrip -v
      - name: Test and build coexist APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testAppSReleaseUnitTest :app:assembleAppSRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: 阅读Max-改稿版
          path: app/build/outputs/apk/appS/release/*.apk
          if-no-files-found: error
